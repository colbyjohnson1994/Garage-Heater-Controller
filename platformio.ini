[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino

; Upload via USB by default. For OTA:
; upload_protocol = espota
; upload_port = 192.168.1.XXX
; upload_flags =
;   --auth=heaterota

monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^6.21.0

build_flags =
    -D FIRMWARE_VERSION=\"1.2.0\"
