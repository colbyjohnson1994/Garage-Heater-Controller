[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino

; OTA is the default (device is rarely accessible by USB)
; --auth must match OTA_PASSWORD in include/secrets.h
upload_protocol = espota
upload_port = 192.168.0.49
upload_flags =
    --auth=heaterota

monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^6.21.0
    knolleary/PubSubClient@^2.8

build_flags =
    -D FIRMWARE_VERSION=\"2.5.1\"
